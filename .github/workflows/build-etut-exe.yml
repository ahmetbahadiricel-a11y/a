name: Build Kuzey Koleji Etut EXE

on:
  push:
    branches:
      - etut-programi-windows-build
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare source archive
        shell: pwsh
        run: |
          $src = "etut_programi_source.zip"
          $bytes = [System.IO.File]::ReadAllBytes($src)
          Write-Host "Source bytes: $($bytes.Length)"
          $sig = [System.Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(12,$bytes.Length))
          Write-Host "Signature/text prefix: $sig"
          if (-not ($bytes.Length -ge 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B)) {
            $txt = [System.Text.Encoding]::ASCII.GetString($bytes).Trim()
            if ($txt.StartsWith("UEsD")) {
              Write-Host "Archive is Base64 text; decoding once..."
              [System.IO.File]::WriteAllBytes("source_decoded.zip", [Convert]::FromBase64String($txt))
              $src = "source_decoded.zip"
            }
          }
          python -m zipfile -t $src
          python -m zipfile -e $src etut_programi

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r etut_programi/requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        working-directory: etut_programi
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Kuzey_Koleji_Etut_Programi" `
            --icon "assets/kuzey.ico" `
            --version-file "version_info.txt" `
            --add-data "assets;assets" `
            --collect-all fitz `
            --collect-all pymupdf `
            app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "etut_programi/dist/Kuzey_Koleji_Etut_Programi.exe"
          if (!(Test-Path $exe)) { throw "EXE olusturulamadi" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuzey_Koleji_Etut_Programi_Windows
          path: etut_programi/dist/Kuzey_Koleji_Etut_Programi.exe
          if-no-files-found: error
          retention-days: 7
